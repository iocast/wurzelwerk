<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="{{ config.title }}">
  <meta property="og:description" content="{{ config.description }}">
  <meta property="og:image" content="{{ get_url(path='favicon.png') }}">
  <link rel="icon" type="image/svg+xml" href="{{ get_url(path='logo.svg') }}">
  <link rel="icon" type="image/png" href="{{ get_url(path='favicon.png') }}">
  <link rel="stylesheet" href="{{ get_url(path='main.css', cachebust=true) }}">
  <script src="{{ get_url(path='js/site.js', cachebust=true) }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="nav" data-nav>
    <a class="nav__brand" href="{{ get_url(path='/') }}">
      <img src="{{ get_url(path='logo.svg') }}" alt="" width="32" height="32">
      <span>Wurzelwerk</span>
    </a>
    <nav class="nav__links" aria-label="Main">
      <a href="{{ get_url(path='/') }}#features">Features</a>
      <a href="{{ get_url(path='/') }}#board">The board</a>
      <a href="{{ get_url(path='/') }}#internals">Under the hood</a>
      <a class="nav__gh" href="{{ config.extra.repo }}" aria-label="GitHub repository">
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <a class="btn btn--small" href="{{ config.extra.releases }}">Download</a>
    </nav>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <a class="nav__brand" href="{{ get_url(path='/') }}">
        <img src="{{ get_url(path='logo.svg') }}" alt="" width="28" height="28">
        <span>Wurzelwerk</span>
      </a>
      <p>Dual-licensed under <a href="{{ config.extra.repo }}/blob/main/LICENSE-MIT.txt">MIT</a> or
        <a href="{{ config.extra.repo }}/blob/main/LICENSE-APACHE.txt">Apache-2.0</a>.
        Built with Rust, iced and RedDB.</p>
      <a href="{{ config.extra.repo }}">GitHub</a>
    </div>
  </footer>
</body>
</html>
